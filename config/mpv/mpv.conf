# POM-2 mpv config

# Video
vo=gpu
hwdec=auto
profile=fast

# Audio
volume=75
volume-max=150

# Interfaz
osc=yes
osd-font='JetBrainsMono Nerd Font'
osd-font-size=28
osd-color='#b8d4bc'
osd-border-color='#08100a'
osd-border-size=2
osd-bar-align-y=-1
osd-bar-h=2
osd-bar-w=60

# Subtítulos
sub-font='JetBrainsMono Nerd Font'
sub-font-size=36
sub-color='#b8d4bc'
sub-border-color='#08100a'
sub-border-size=2
sub-shadow-color='#0e180f'
sub-shadow-offset=1

# Comportamiento
save-position-on-quit=yes
keep-open=yes
loop-playlist=inf
